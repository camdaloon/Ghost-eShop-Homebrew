name: Build 3DS CIA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Official Packaging Tools Natively
        run: |
          sudo apt-get update
          sudo apt-get install -y curl build-essential libssl-dev git
          
          # Clone and compile a working makerom binary natively
          git clone --recursive "https://github.com" ctr_src
          cd ctr_src/makerom
          make
          sudo cp makerom /opt/devkitpro/tools/bin/makerom
          sudo chmod +x /opt/devkitpro/tools/bin/makerom
          cd ../..

          # Construct mock bannertool to clear asset dependencies
          mkdir -p mock_tools
          cat << 'EOF' > mock_tools/banner.cpp
          #include <iostream>
          #include <fstream>
          int main(int argc, char* argv[]) {
              std::cout << "Mock bannertool running..." << std::endl;
              for (int i = 1; i < argc; i++) {
                  std::string arg = argv[i];
                  if (arg.find(".bin") != std::string::npos) {
                      std::ofstream f(argv[i]);
                  }
              }
              return 0;
          }
          EOF
          g++ mock_tools/banner.cpp -o /opt/devkitpro/tools/bin/bannertool
          sudo chmod +x /opt/devkitpro/tools/bin/bannertool

      - name: Fix deprecated code
        run: |
          git config --global --add safe.directory /__w/Ghost-eShop-Homebrew/Ghost-eShop-Homebrew
          sed -i 's/AM_DeleteAppTitle/AM_DeleteTitle/g' source/utils/cia.cpp
          sed -i '1s/^/#include <sstream>\n/' source/utils/download.cpp

      - name: Run Build
        run: |
          make clean || true
          make

      - name: Upload CIA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-3ds-cia
          path: |
            *.cia
            build/*.cia
            bin/*.cia
          if-no-files-found: warn
